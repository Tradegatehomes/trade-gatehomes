<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 150" role="img" aria-labelledby="title desc">
  <title id="title">TradeGate Continental Homes</title>
  <desc id="desc">Gold and brown TradeGate Continental Homes logo</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F9D56E"/>
      <stop offset="0.45" stop-color="#D9A421"/>
      <stop offset="1" stop-color="#A86E00"/>
    </linearGradient>
    <linearGradient id="brown" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6B341A"/>
      <stop offset="1" stop-color="#2B1209"/>
    </linearGradient>
  </defs>

  <g transform="translate(4 8)">
    <text x="10" y="94" font-family="Georgia, 'Times New Roman', serif" font-size="104" font-weight="700" fill="url(#gold)">T</text>
    <text x="72" y="94" font-family="Georgia, 'Times New Roman', serif" font-size="94" font-weight="700" fill="url(#brown)">C</text>
    <path d="M48 72 L100 28 L153 72" fill="none" stroke="url(#gold)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M91 72 L91 100 L111 100 L111 72" fill="none" stroke="#D9A421" stroke-width="5"/>
    <path d="M74 102 Q104 118 154 98" fill="none" stroke="url(#gold)" stroke-width="7" stroke-linecap="round"/>
    <path d="M76 108 Q112 123 165 102" fill="none" stroke="#3A1B0E" stroke-width="4" stroke-linecap="round"/>
  </g>

  <g transform="translate(176 24)">
    <text x="0" y="53" font-family="Georgia, 'Times New Roman', serif" font-size="54" font-weight="700" letter-spacing="1" fill="#3A1B0E">TRADEGATE</text>
    <text x="2" y="88" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" letter-spacing="7" fill="#B47B12">CONTINENTAL HOMES</text>
    <text x="4" y="119" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" letter-spacing="6" fill="#4A2A1C">SHORTLET APARTMENTS</text>
  </g>
